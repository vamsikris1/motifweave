# ==============================================================================
# MotifWeave: Experiment B - Color-Invariant Model Configuration
# ==============================================================================

experiment_name: "color_invariant_convnext_tiny"
description: "Color-invariant metric-learning model trained with controlled chromatic jitter and grayscale probability"

# Reproducibility (IDENTICAL TO EXPERIMENT A)
seed: 42

# Data and Paths (IDENTICAL TO EXPERIMENT A)
train_csv: "data/processed/splits/train.csv"
val_csv: "data/processed/splits/val.csv"
test_csv: "data/processed/splits/test.csv"
checkpoint_dir: "outputs/checkpoints"
log_dir: "outputs/metrics"
figures_dir: "outputs/figures"

# Model Architecture (IDENTICAL TO EXPERIMENT A)
backbone: "convnext_tiny"
pretrained: true
weights_name: "ConvNeXt_Tiny_Weights.IMAGENET1K_V1"
freeze_backbone: "full"        # 'full' freezes ConvNeXt features, trains GeM + Projection Head
pooling: "gem"                 # 'gem' or 'avg'
gem_p: 3.0
head_type: "mlp"               # 'mlp' or 'linear'
dropout: 0.1
embedding_dim: 256
l2_normalize: true

# Preprocessing & Augmentation (EXPERIMENTAL CHANGE ONLY)
image_size: 224
augmentation: "color_invariant"
hue_jitter: 0.30               # Controlled hue rotation (modulates chromatic angles)
saturation_jitter: 0.20        # Saturation perturbation
brightness_jitter: 0.15        # Value perturbation
contrast_jitter: 0.15          # Micro-contrast preservation
p_grayscale: 0.15              # Forces representation to encode pure spatial/weave geometry

# Batch Sampling (Source-Aware P x K) (IDENTICAL TO EXPERIMENT A)
p_sources: 8                   # Number of distinct source IDs per batch
k_variants: 4                  # Number of variants per source ID per batch
batch_size: 32                 # Total batch size = P * K

# Metric Learning Objective (IDENTICAL TO EXPERIMENT A)
loss: "supervised_contrastive"
temperature: 0.07

# Optimization (IDENTICAL TO EXPERIMENT A)
optimizer: "adamw"
learning_rate: 0.0005
weight_decay: 0.0001
epochs: 5
scheduler: "cosine"
min_lr: 0.000005
num_workers: 0

# Checkpointing & Validation (IDENTICAL TO EXPERIMENT A)
save_best_metric: "val_loss"
early_stopping_patience: 5
